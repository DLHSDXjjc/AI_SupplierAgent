# 供应链自动补货Agent — 模型与API配置文件（示例）
#
# 使用方法：
#   1. 复制本文件为 modelConfig.yaml (同目录)
#   2. 将下方 api_key 替换为你自己的 DeepSeek API Key
#   3. modelConfig.yaml 已在 .gitignore 中，不会被提交

# ==================== Embedding模型配置 ====================
embedding:
  model_name: "moka-ai/m3e-base"     # 中文优化的句子向量模型, 768维
  device: "cpu"                        # 推理设备: cpu / cuda

# ==================== DeepSeek LLM配置 ====================
deepseek:
  api_key: "sk-YOUR_DEEPSEEK_API_KEY_HERE"         # DeepSeek API密钥(请替换为自己的)
  base_url: "https://api.deepseek.com/v1"          # DeepSeek API基础地址
  model: "deepseek-chat"                            # 模型名称
  temperature: 0.7                                  # 生成温度, 越高越随机
  max_tokens: 2000                                  # 最大生成token数

# ==================== ChromaDB向量数据库配置 ====================
chromadb:
  persist_directory: "./vector_db"                   # 持久化存储路径
  collection_name: "supply_chain_knowledge"          # 集合名称

# ==================== 文本分块配置 ====================
text_splitter:
  chunk_size: 300                                    # 每个文本块的最大字符数
  chunk_overlap: 40                                  # 相邻文本块的重叠字符数
  separators:                                        # 分隔符优先级(从大到小)
    - "\n\n"                                         # 段落分隔
    - "\n"                                           # 换行分隔
    - "。"                                           # 中文句号
    - "；"                                           # 中文分号
    - "，"                                           # 中文逗号
    - " "                                            # 空格

# ==================== Nacos服务注册配置 ====================
nacos:
  server_address: "192.168.203.129:8848"             # Nacos服务端地址
  service_name: "supplychain-rag"                    # 注册的服务名称
  ip: "192.168.203.129"                              # 本机IP地址
  port: 8001                                         # 服务端口号
  namespace: ""                                      # 命名空间(默认public)
  group: "DEFAULT_GROUP"                             # 分组
  cluster_name: "DEFAULT"                            # 集群名称
  heartbeat_interval: 5                              # 心跳间隔(秒)

# ==================== Redis 配置(L2 缓存用) ====================
redis:
  host: "192.168.203.129"
  port: 6379
  db: 3                                  # 跟 L1 共享 db=3,key 前缀隔离(L1=h:,L2=ragcache:)
  # password: ""                          # 暂无密码,如需启用去掉注释

# ==================== 语义缓存配置(L2) ====================
semantic_cache:
  enabled: true                          # 一键开关
  ttl: 21600                             # 6h,跟 L1 对齐
  threshold: 0.88                        # cosine ≥ 这个数才算命中
  key_prefix: "ragcache:"                # metadata HASH key 前缀
  vector_key: "ragcache:vectors"         # vectorset key(存所有 embedding)
  embedding_dim: 768                     # 跟现有 m3e-base 一致
